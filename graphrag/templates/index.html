<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Graph Q&amp;A</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#121212; color:#eee;
         max-width:820px; margin:0 auto; padding:48px 20px; }
  h1 { color:#76b900; font-size:24px; margin-bottom:4px; }
  .sub { color:#888; font-size:14px; margin-bottom:28px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px; font-size:16px; border:none; border-radius:6px;
          background:#242424; color:#eee; }
  input::placeholder { color:#777; }
  button { background:#76b900; color:#111; padding:12px 20px; font-size:16px;
           font-weight:600; border:none; border-radius:6px; cursor:pointer; }
  button:hover { background:#8fd400; }
  .examples { margin-top:14px; font-size:13px; color:#888; }
  .examples code { background:#242424; padding:2px 6px; border-radius:4px;
                   cursor:pointer; color:#aaa; }
  #out { margin-top:28px; }
  .route { display:inline-block; background:#242424; color:#76b900; font-size:12px;
           padding:3px 9px; border-radius:4px; font-family:monospace; }
  .summary { margin:14px 0; font-size:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:7px 4px; border-bottom:1px solid #262626; }
  td.v { text-align:right; color:#76b900; font-family:monospace; width:110px; }
  .detail { margin-top:16px; padding:14px; background:#1b1b1b; border-left:3px solid #76b900;
            font-size:14px; color:#bbb; line-height:1.5; }
  .err { color:#ff6b6b; }
</style>
</head>
<body>
  <h1>Docs Graph Q&amp;A</h1>
  <div class="sub">{{ pages }} documentation pages, {{ links }} links between them.
    Questions route to a text lookup or to a graph algorithm.</div>

  <form id="f">
    <input id="q" name="query" placeholder="Ask about the NetworkX / cuGraph docs" autofocus>
    <button type="submit">Ask</button>
  </form>

  <div class="examples">
    Try:
    <code>how do I install networkx</code>
    <code>which page is most central</code>
    <code>are there separate clusters in the docs</code>
  </div>

  <div id="out"></div>

<script>
const out = document.getElementById("out");

document.querySelectorAll(".examples code").forEach(c =>
  c.onclick = () => { document.getElementById("q").value = c.textContent; submit(); });

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); submit(); });

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function submit() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  out.innerHTML = "<div class='sub'>Working...</div>";

  fetch("/ask", {
    method: "POST",
    body: new URLSearchParams({ query: q }),
    headers: { "Content-Type": "application/x-www-form-urlencoded" }
  })
  .then(r => r.json())
  .then(d => {
    if (d.error) { out.innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
    let html = `<span class="route">${esc(d.route)}</span>`;
    html += `<div class="summary">${esc(d.summary)}</div>`;
    if (d.rows && d.rows.length) {
      html += "<table>" + d.rows.map(([name, val]) =>
        `<tr><td>${esc(name)}</td><td class="v">${esc(
           typeof val === "number" ? val.toFixed(4) : val)}</td></tr>`).join("") + "</table>";
    }
    if (d.detail) html += `<div class="detail">${esc(d.detail)}</div>`;
    out.innerHTML = html;
  })
  .catch(err => out.innerHTML = `<div class="err">${esc(err)}</div>`);
}
</script>
</body>
</html>
